@if (playerName().length === 0) {
  <form [formGroup]="playerNameForm" class="flex-column">
    <div class="flex-column">
      <label for="player-name-input">Player Name</label>
      <input id="player-name-input" [formControl]="playerNameForm.controls.playerName" />
    </div>
    <button id="join-button" type="submit" [disabled]="playerNameForm.invalid">Join</button>
  </form>
} @else {}
