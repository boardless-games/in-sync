@if (!initialized()) {
  <app-bg-splash [ready]="[audioService.ready]" (continue)="continue()"></app-bg-splash>
} @else {
  <img id="in-sync-logo" src="logos/in-sync.gif" alt="In Sync logo." />
  <div id="title" class="flex-row">
    <span>In&nbsp;</span>
    <span>Sync</span>
  </div>
  <div id="main-menu" class="flex-column">
    <button id="new-game-button">New Game</button>
    <form #form="ngForm" (ngSubmit)="joinGame(form)" class="flex-column">
      <label for="game-code-input">Game Code</label>
      <input id="game-code-input" name="gameCode" ngModel required />
      <button id="join-game-button" type="submit" [disabled]="form.invalid">Join Game</button>
    </form>
  </div>
}
