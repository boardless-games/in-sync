@if (alert().length > 0) {
  <div id="alert-container" class="flex-row">
    <span>{{ alert() }}</span>
    <app-icon-button
      id="close-alert-button"
      [icon]="icons.CLOSE"
      title="Dismiss"
      (clicked)="showNextAlert()"></app-icon-button>
  </div>
}
@if (initialized()) {
  <router-outlet></router-outlet>
} @else {
  <app-bg-splash [ready]="[audioService.ready]" (continued)="continue()"></app-bg-splash>
}
