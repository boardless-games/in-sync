info:
  name: Start
  type: http
  seq: 7

http:
  method: POST
  url: "{{SERVER_PROTOCOL}}://{{SERVER_DOMAIN}}:{{SERVER_PORT}}/in-sync-api/game/:gameCode/start"
  params:
    - name: gameCode
      value: "{{gameCode}}"
      type: path
  body:
    type: json
    data: |-
      {
        "songType": "{{process.env.SONG_TYPE}}",
        "songTempo": "{{process.env.SONG_TEMPO}}",
        "songDuration": "{{process.env.SONG_DURATION}}",
        "randomPlayerOrder": {{process.env.RANDOM_PLAYER_ORDER}}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
