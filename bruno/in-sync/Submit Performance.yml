info:
  name: Submit Performance
  type: http
  seq: 10

http:
  method: POST
  url: "{{SERVER_PROTOCOL}}://{{SERVER_DOMAIN}}:{{SERVER_PORT}}/in-sync/game/:gameCode/performance"
  params:
    - name: gameCode
      value: "{{gameCode}}"
      type: path
  body:
    type: json
    data: |-
      {
        "playerName": "{{playerName}}",
        "schedule": {{schedule}},
        "performance": [{{process.env.PERFORMANCE}}]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
