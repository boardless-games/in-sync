info:
  name: Get Schedule
  type: http
  seq: 11

http:
  method: GET
  url: "{{SERVER_PROTOCOL}}://{{SERVER_DOMAIN}}:{{SERVER_PORT}}/in-sync-api/game/:gameCode/schedule"
  params:
    - name: gameCode
      value: "{{gameCode}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let schedule = "";
        if (res.status === 200) {
          let data = res.getBody();
          schedule = data.schedule;
        }
        bru.setVar("schedule", schedule);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
