info:
  name: Player
  type: http
  seq: 4

http:
  method: POST
  url: "{{SERVER_PROTOCOL}}://{{SERVER_DOMAIN}}:{{SERVER_PORT}}/in-sync/game/:gameCode/player"
  params:
    - name: gameCode
      value: "{{gameCode}}"
      type: path
  body:
    type: json
    data: |-
      {
        "playerName": "Craiglington"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let playerName = "";
        if (res.status === 201) {
          let data = req.getBody();
          playerName = data.playerName;
        }
        bru.setVar("playerName", playerName);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
