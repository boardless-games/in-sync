info:
  name: Get Game
  type: http
  seq: 4

http:
  method: GET
  url: "{{SERVER_PROTOCOL}}://{{SERVER_DOMAIN}}:{{SERVER_PORT}}/in-sync-api/game/:gameCode"
  params:
    - name: gameCode
      value: "{{gameCode}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
